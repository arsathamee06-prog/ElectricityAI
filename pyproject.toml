[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ElectricityAI"
version = "0.1.0"
description = "Electricity Demand Forecasting System"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Flask==2.3.3",
    "Flask-CORS==4.0.0",
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "statsmodels==0.14.0",
    "prophet==1.1.4",
    "joblib==1.3.1",
    "python-dateutil==2.8.2",
    "pytz==2023.3",
    "python-dotenv==1.0.0",
    "Werkzeug==2.3.7",
]

[tool.setuptools]
packages = {find = {include = ["backend*", "utils*"]}}

[tool.vercel]
entrypoint = "backend.app:app"
